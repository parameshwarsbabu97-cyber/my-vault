<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vault</title>
<style>
  :root{
    --bg:#14171D; --surface:#1D2129; --surface-2:#232833; --border:#2C313C;
    --brass:#C9A15A; --brass-dim:#8A733F; --teal:#6FAE9C; --danger:#C0524B;
    --text:#EDEEF0; --text-muted:#8B909C;
  }
  :root[data-theme="light"]{
    --bg:#ECEAE3; --surface:#FFFFFF; --surface-2:#F5F3EC; --border:#DBD7CB;
    --brass:#B07F3B; --brass-dim:#8A733F; --teal:#3E7D6C; --danger:#A63F39;
    --text:#1D2129; --text-muted:#726F63;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    transition:background .25s ease, color .25s ease;
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'SF Mono',Consolas,monospace;}
  ::selection{background:var(--brass);color:#14171D;}

  .setup-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;}
  .setup-form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px;}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:24px;letter-spacing:0.14em;text-transform:uppercase;font-size:13px;color:var(--text-muted);font-weight:600;}
  .brand .dot{width:6px;height:6px;border-radius:50%;background:var(--brass);}
  .setup-title{text-align:center;font-size:15px;color:var(--text-muted);margin-bottom:6px;}

  input, textarea{
    background:var(--surface); border:1px solid var(--border); color:var(--text);
    padding:13px 14px; border-radius:8px; font-size:15px; outline:none; width:100%;
    transition:border-color .15s ease; font-family:inherit;
  }
  input:focus, textarea:focus{border-color:var(--brass);}
  input::placeholder, textarea::placeholder{color:#7d8290;}

  button{cursor:pointer;border:none;font-family:inherit;font-weight:600;}
  .btn-primary{background:var(--brass);color:#14171D;padding:13px 14px;border-radius:8px;font-size:15px;}
  .btn-primary:hover{background:#d6ae66;}
  .btn-primary:disabled{background:var(--border);color:var(--text-muted);cursor:default;}
  .err-msg{color:var(--danger);font-size:13px;text-align:center;min-height:16px;}
  .hint{color:var(--text-muted);font-size:12px;text-align:center;line-height:1.5;margin-top:2px;}

  .app{display:none;min-height:100vh;flex-direction:column;max-width:640px;margin:0 auto;}
  .app.active{display:flex;}
  header.top{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 14px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--border);}
  .top-title{display:flex;align-items:center;gap:9px;font-size:14px;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-muted);font-weight:600;}
  .top-title .dot{width:6px;height:6px;border-radius:50%;background:var(--brass);}
  .lock-btn{background:transparent;color:var(--text-muted);border:1px solid var(--border);padding:7px 12px;border-radius:7px;font-size:12px;display:flex;align-items:center;gap:6px;}
  .lock-btn:hover{color:var(--text);border-color:var(--brass-dim);}

  .search-row{padding:16px 20px 10px;display:flex;gap:10px;}
  .search-row input{flex:1;}
  .add-btn{background:var(--surface-2);color:var(--brass);border:1px solid var(--border);width:46px;flex-shrink:0;border-radius:8px;font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;}
  .add-btn:hover{border-color:var(--brass);}
  .count-row{padding:0 20px 6px;color:var(--text-muted);font-size:12px;font-family:'SF Mono',Consolas,monospace;}

  .list{padding:6px 20px 40px;display:flex;flex-direction:column;gap:10px;flex:1;}
  .entry{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
  .entry-head{display:flex;align-items:center;justify-content:space-between;cursor:pointer;gap:10px;}
  .entry-site{font-weight:600;font-size:15px;}
  .sno{color:var(--brass);font-size:12px;min-width:18px;text-align:right;}
  .entry-user{color:var(--text-muted);font-size:12px;font-family:'SF Mono',Consolas,monospace;margin-top:2px;}
  .chev{color:var(--text-muted);transition:transform .2s ease;flex-shrink:0;}
  .chev.open{transform:rotate(180deg);}
  .entry-body{max-height:0;overflow:hidden;transition:max-height .25s ease;}
  .entry-body.open{max-height:500px;}
  .entry-body-in{padding-top:14px;display:flex;flex-direction:column;gap:10px;}
  .field-row{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:9px 11px;}
  .field-label{font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-muted);width:56px;flex-shrink:0;}
  .field-val{flex:1;font-family:'SF Mono',Consolas,monospace;font-size:13px;word-break:break-all;}
  .icon-btn{background:transparent;border:none;color:var(--text-muted);padding:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .icon-btn:hover{color:var(--brass);}
  .icon-btn svg{width:15px;height:15px;}
  .entry-actions{display:flex;gap:8px;margin-top:2px;}
  .mini-btn{flex:1;background:transparent;border:1px solid var(--border);color:var(--text-muted);padding:8px;border-radius:7px;font-size:12px;font-weight:500;}
  .mini-btn:hover{color:var(--text);border-color:var(--brass-dim);}
  .mini-btn.danger:hover{color:var(--danger);border-color:var(--danger);}
  .empty{text-align:center;color:var(--text-muted);padding:60px 20px;font-size:14px;line-height:1.6;}

  .overlay{display:none;position:fixed;inset:0;background:rgba(10,12,16,0.75);align-items:flex-end;justify-content:center;z-index:20;backdrop-filter:blur(2px);}
  .overlay.active{display:flex;}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:16px 16px 0 0;width:100%;max-width:640px;padding:22px 20px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;max-height:88vh;overflow-y:auto;}
  @media(min-width:680px){.overlay{align-items:center;} .modal{border-radius:16px;max-width:420px;}}
  .modal h3{margin:0 0 4px;font-size:17px;}
  .field-group{display:flex;flex-direction:column;gap:6px;}
  .field-group label{font-size:12px;color:var(--text-muted);}
  .pw-input-row{position:relative;display:flex;align-items:center;}
  .pw-input-row input{padding-right:44px;}
  .pw-input-row .icon-btn{position:absolute;right:6px;}
  .gen-row{display:flex;gap:8px;}
  .gen-row .mini-btn{flex:none;padding:9px 12px;}
  .modal-actions{display:flex;gap:10px;margin-top:6px;}
  .btn-ghost{flex:1;background:transparent;border:1px solid var(--border);color:var(--text-muted);padding:13px;border-radius:8px;font-size:14px;}
  .btn-ghost:hover{color:var(--text);}
  .modal-actions .btn-primary{flex:1;}
  .qa-row{display:flex;gap:6px;margin-bottom:8px;}
  .qa-row input{flex:1;font-size:13px;padding:10px 11px;}
  .qa-row .icon-btn{background:var(--surface-2);border:1px solid var(--border);border-radius:7px;width:38px;flex-shrink:0;}
  .qa-row .icon-btn:hover{color:var(--danger);border-color:var(--danger);}
  .qa-view{display:flex;flex-direction:column;gap:8px;}
  .qa-view-item{background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:9px 11px;}
  .qa-q{font-size:11px;color:var(--text-muted);margin-bottom:3px;}
  .qa-a{font-family:'SF Mono',Consolas,monospace;font-size:13px;word-break:break-all;}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--surface-2);border:1px solid var(--brass-dim);color:var(--text);padding:10px 18px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s ease, transform .2s ease;z-index:30;pointer-events:none;display:flex;align-items:center;gap:7px;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast .dot{width:6px;height:6px;border-radius:50%;background:var(--teal);}
</style>
</head>
<body>

<div class="setup-wrap" id="setupScreen">
  <div class="brand"><span class="dot"></span>VAULT</div>
  <form class="setup-form" id="setupForm">
    <div class="setup-title">Connect to your Google Sheet</div>
    <input type="text" id="cfgUrl" placeholder="Apps Script Web App URL" autocomplete="off" />
    <input type="password" id="cfgSecret" placeholder="Secret token" autocomplete="off" />
    <div class="err-msg" id="setupErr"></div>
    <button type="submit" class="btn-primary" id="connectBtn">Connect</button>
    <div class="hint">Both come from your deployed Apps Script (Deploy \u2192 Web app URL, and the SECRET value in Code.gs).</div>
  </form>
</div>

<div class="app" id="app">
  <header class="top">
    <div class="top-title"><span class="dot"></span>Vault</div>
    <div style="display:flex;gap:8px;">
      <button class="lock-btn" id="themeBtn" title="Toggle light/dark">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="themeIcon"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
      </button>
      <button class="lock-btn" id="refreshBtn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
      </button>
      <button class="lock-btn" id="disconnectBtn">Disconnect</button>
    </div>
  </header>
  <div id="statusBanner" style="display:none; background:rgba(192,82,75,0.12); border-bottom:1px solid var(--danger); color:#e8a39e; font-size:12px; padding:9px 20px; line-height:1.5;"></div>
  <div class="search-row">
    <input type="text" id="searchInput" placeholder="Search entries…" />
    <button class="add-btn" id="addBtn">+</button>
  </div>
  <div class="count-row" id="countRow"></div>
  <div class="list" id="list"></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal">
    <h3 id="modalTitle">New entry</h3>
    <div class="field-group"><label>Document type</label><input type="text" id="fSite" placeholder="e.g. Aadhar Card, PAN Card, Bank Login" /></div>
    <div class="field-group"><label>Username</label><input type="text" id="fUser" placeholder="e.g. yourname" autocomplete="off" /></div>
    <div class="field-group">
      <label>Password</label>
      <div class="pw-input-row">
        <input type="password" id="fPass" placeholder="Password" autocomplete="off" />
        <button type="button" class="icon-btn" id="toggleFPass"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
      </div>
      <div class="gen-row"><button type="button" class="mini-btn" id="genBtn">Generate strong password</button></div>
    </div>
    <div class="field-group">
      <label>Hints</label>
      <div id="qaList"></div>
      <button type="button" class="mini-btn" id="addQaBtn">+ Add hint</button>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn-ghost" id="cancelBtn">Cancel</button>
      <button type="button" class="btn-primary" id="saveBtn">Save entry</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span class="dot"></span><span id="toastText"></span></div>

<script>
/* ===================== config (stored locally in this browser) ===================== */
let apiUrl = localStorage.getItem('vault-api-url') || '';
let apiSecret = localStorage.getItem('vault-api-secret') || '';
let entries = [];
let openId = null;
let editingId = null;

const setupScreen = document.getElementById('setupScreen');
const app = document.getElementById('app');
const setupErr = document.getElementById('setupErr');
const connectBtn = document.getElementById('connectBtn');

/* ===================== theme ===================== */
const sunMoonPath = {
  sun: `<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>`,
  moon: `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>`
};
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  const icon = document.getElementById('themeIcon');
  if(icon) icon.innerHTML = theme === 'light' ? sunMoonPath.sun : sunMoonPath.moon;
}
function initTheme(){
  let theme = localStorage.getItem('vault-theme');
  if(!theme) theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
  applyTheme(theme);
}
function toggleTheme(){
  const current = document.documentElement.getAttribute('data-theme') || 'dark';
  const next = current === 'light' ? 'dark' : 'light';
  applyTheme(next);
  localStorage.setItem('vault-theme', next);
}
initTheme();
document.getElementById('themeBtn').addEventListener('click', toggleTheme);

function showToast(msg){
  const toast = document.getElementById('toast');
  document.getElementById('toastText').textContent = msg;
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>toast.classList.remove('show'), 1800);
}

/* ===================== API layer ===================== */
async function apiCall(action, extra){
  const params = new URLSearchParams(Object.assign({ action, secret: apiSecret }, extra || {}));
  const isWrite = action !== 'list';
  const opts = isWrite
    ? { method: 'POST', body: params }
    : { method: 'GET' };
  const url = isWrite ? apiUrl : (apiUrl + '?' + params.toString());
  const res = await fetch(url, opts);
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data;
}

/* ===================== setup / connect ===================== */
function tryEnterApp(){
  if(apiUrl && apiSecret){
    setupScreen.style.display = 'none';
    app.classList.add('active');
    loadEntries();
  } else {
    setupScreen.style.display = 'flex';
    app.classList.remove('active');
  }
}
tryEnterApp();

document.getElementById('setupForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  setupErr.textContent = '';
  const url = document.getElementById('cfgUrl').value.trim();
  const secret = document.getElementById('cfgSecret').value.trim();
  if(!url || !secret){ setupErr.textContent = 'Both fields are required.'; return; }

  connectBtn.disabled = true;
  connectBtn.textContent = 'Connecting…';
  try{
    const testParams = new URLSearchParams({ action: 'list', secret });
    const res = await fetch(url + '?' + testParams.toString());
    const data = await res.json();
    if(data.error) throw new Error(data.error === 'Unauthorized' ? 'Wrong secret token.' : data.error);

    apiUrl = url; apiSecret = secret;
    localStorage.setItem('vault-api-url', url);
    localStorage.setItem('vault-api-secret', secret);
    tryEnterApp();
  } catch(err){
    setupErr.textContent = err.message || 'Could not connect. Check the URL and try again.';
  } finally {
    connectBtn.disabled = false;
    connectBtn.textContent = 'Connect';
  }
});

document.getElementById('disconnectBtn').addEventListener('click', ()=>{
  if(!confirm('Disconnect from this Sheet? Your data stays in Google Sheets \u2014 this just forgets the connection on this device.')) return;
  localStorage.removeItem('vault-api-url');
  localStorage.removeItem('vault-api-secret');
  apiUrl = ''; apiSecret = '';
  entries = [];
  tryEnterApp();
});

/* ===================== load / status ===================== */
function setStatus(msg){
  const banner = document.getElementById('statusBanner');
  if(msg){
    banner.textContent = msg;
    banner.style.display = 'block';
  } else {
    banner.style.display = 'none';
  }
}

async function loadEntries(){
  setStatus('Loading…');
  try{
    const data = await apiCall('list');
    entries = data.entries || [];
    setStatus(null);
    renderList();
  } catch(err){
    setStatus('Couldn\u2019t load from Sheets: ' + err.message);
  }
}

document.getElementById('refreshBtn').addEventListener('click', loadEntries);

/* ===================== render ===================== */
const listEl = document.getElementById('list');
const countRow = document.getElementById('countRow');
const searchInput = document.getElementById('searchInput');

function iconEye(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle></svg>`; }
function iconCopy(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`; }
function iconChev(){ return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>`; }
function iconTrash(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6M14 11v6"></path></svg>`; }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escapeAttr(s){ return (s||'').replace(/"/g,'&quot;'); }

function renderList(){
  const q = searchInput.value.trim().toLowerCase();
  const filtered = entries
    .filter(e => !q || (e.site||'').toLowerCase().includes(q) || (e.user||'').toLowerCase().includes(q))
    .sort((a,b)=> (a.site||'').localeCompare(b.site||''));

  countRow.textContent = entries.length === 0 ? '' : `${filtered.length} of ${entries.length} entr${entries.length===1?'y':'ies'}`;

  if(entries.length === 0){ listEl.innerHTML = `<div class="empty">No entries yet.<br/>Tap + to add your first one.</div>`; return; }
  if(filtered.length === 0){ listEl.innerHTML = `<div class="empty">No matches for "${escapeHtml(searchInput.value)}".</div>`; return; }

  listEl.innerHTML = filtered.map((e, listIdx) => {
    const isOpen = openId === e.id;
    const sno = listIdx + 1;
    const qaHtml = (e.qa && e.qa.length) ? e.qa.map((pair,i) => `
          <div class="qa-view-item">
            <div class="qa-q">${escapeHtml(pair.q || 'Hint')}</div>
            <div style="display:flex;align-items:center;gap:8px;">
              <div class="qa-a" data-qa-display="${e.id}-${i}" data-shown="0">${'•'.repeat(Math.min((pair.a||'').length,14)) || '—'}</div>
              <button class="icon-btn" data-qa-reveal="${e.id}-${i}" title="Show/hide">${iconEye()}</button>
              <button class="icon-btn" data-copy="${encodeURIComponent(pair.a||'')}" title="Copy answer">${iconCopy()}</button>
            </div>
          </div>`).join('') : '';
    return `
    <div class="entry" data-id="${e.id}">
      <div class="entry-head" data-toggle="${e.id}">
        <div style="display:flex;align-items:baseline;gap:9px;">
          <div class="sno mono">${sno}</div>
          <div><div class="entry-site">${escapeHtml(e.site)}</div><div class="entry-user">${escapeHtml(e.user || '—')}</div></div>
        </div>
        <div class="chev ${isOpen?'open':''}">${iconChev()}</div>
      </div>
      <div class="entry-body ${isOpen?'open':''}">
        <div class="entry-body-in">
          <div class="field-row">
            <div class="field-label">User</div>
            <div class="field-val">${escapeHtml(e.user || '—')}</div>
            <button class="icon-btn" data-copy="${encodeURIComponent(e.user||'')}" title="Copy username">${iconCopy()}</button>
          </div>
          <div class="field-row">
            <div class="field-label">Pass</div>
            <div class="field-val" data-pass-display="${e.id}">${'•'.repeat(Math.min((e.pass||'').length,14)) || '—'}</div>
            <button class="icon-btn" data-reveal="${e.id}" title="Show/hide">${iconEye()}</button>
            <button class="icon-btn" data-copy="${encodeURIComponent(e.pass||'')}" title="Copy password">${iconCopy()}</button>
          </div>
          ${qaHtml ? `<div class="qa-view">${qaHtml}</div>` : ''}
          <div class="entry-actions">
            <button class="mini-btn" data-edit="${e.id}">Edit</button>
            <button class="mini-btn danger" data-del="${e.id}">Delete</button>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}

searchInput.addEventListener('input', renderList);

listEl.addEventListener('click', async (e)=>{
  const toggle = e.target.closest('[data-toggle]');
  const reveal = e.target.closest('[data-reveal]');
  const qaReveal = e.target.closest('[data-qa-reveal]');
  const copy = e.target.closest('[data-copy]');
  const editBtn = e.target.closest('[data-edit]');
  const delBtn = e.target.closest('[data-del]');

  if(toggle){ openId = openId === toggle.dataset.toggle ? null : toggle.dataset.toggle; renderList(); return; }
  if(reveal){
    const id = reveal.dataset.reveal;
    const entry = entries.find(x=>x.id===id);
    const disp = document.querySelector(`[data-pass-display="${id}"]`);
    if(disp.dataset.shown === '1'){ disp.textContent = '•'.repeat(Math.min((entry.pass||'').length,14)) || '—'; disp.dataset.shown = '0'; }
    else { disp.textContent = entry.pass || '—'; disp.dataset.shown = '1'; }
    return;
  }
  if(qaReveal){
    const key = qaReveal.dataset.qaReveal;
    const dashIdx = key.lastIndexOf('-');
    const entry = entries.find(x=>x.id===key.slice(0, dashIdx));
    const pair = entry.qa[parseInt(key.slice(dashIdx+1), 10)];
    const disp = document.querySelector(`[data-qa-display="${key}"]`);
    if(disp.dataset.shown === '1'){ disp.textContent = '•'.repeat(Math.min((pair.a||'').length,14)) || '—'; disp.dataset.shown = '0'; }
    else { disp.textContent = pair.a || '—'; disp.dataset.shown = '1'; }
    return;
  }
  if(copy){
    try{ await navigator.clipboard.writeText(decodeURIComponent(copy.dataset.copy)); showToast('Copied to clipboard'); }
    catch(err){ showToast('Copy failed'); }
    return;
  }
  if(editBtn){ openEditModal(editBtn.dataset.edit); return; }
  if(delBtn){
    const id = delBtn.dataset.del;
    if(confirm('Delete this entry? This cannot be undone.')){
      try{
        await apiCall('delete', { id });
        entries = entries.filter(x=>x.id!==id);
        renderList();
        showToast('Entry deleted');
      } catch(err){ showToast('Delete failed: ' + err.message); }
    }
    return;
  }
});

/* ===================== modal ===================== */
const overlay = document.getElementById('overlay');
const modalTitle = document.getElementById('modalTitle');
const fSite = document.getElementById('fSite');
const fUser = document.getElementById('fUser');
const fPass = document.getElementById('fPass');
const qaList = document.getElementById('qaList');

function addQaRow(q, a){
  const row = document.createElement('div');
  row.className = 'qa-row';
  row.innerHTML = `<input type="text" class="qa-q-input" placeholder="Hint" value="${escapeAttr(q||'')}" />
    <input type="text" class="qa-a-input" placeholder="Answer" value="${escapeAttr(a||'')}" />
    <button type="button" class="icon-btn qa-remove" title="Remove">${iconTrash()}</button>`;
  row.querySelector('.qa-remove').addEventListener('click', ()=> row.remove());
  qaList.appendChild(row);
}
function collectQaPairs(){
  const pairs = [];
  qaList.querySelectorAll('.qa-row').forEach(row=>{
    const q = row.querySelector('.qa-q-input').value.trim();
    const a = row.querySelector('.qa-a-input').value.trim();
    if(q || a) pairs.push({ q, a });
  });
  return pairs;
}
document.getElementById('addQaBtn').addEventListener('click', ()=> addQaRow('', ''));

function openAddModal(){
  editingId = null;
  modalTitle.textContent = 'New entry';
  fSite.value = ''; fUser.value = ''; fPass.value = '';
  fPass.type = 'password';
  qaList.innerHTML = '';
  overlay.classList.add('active');
  setTimeout(()=>fSite.focus(), 50);
}
function openEditModal(id){
  const e = entries.find(x=>x.id===id);
  if(!e) return;
  editingId = id;
  modalTitle.textContent = 'Edit entry';
  fSite.value = e.site; fUser.value = e.user; fPass.value = e.pass;
  fPass.type = 'password';
  qaList.innerHTML = '';
  (e.qa || []).forEach(pair => addQaRow(pair.q, pair.a));
  overlay.classList.add('active');
}
function closeModal(){ overlay.classList.remove('active'); }

document.getElementById('addBtn').addEventListener('click', openAddModal);
document.getElementById('cancelBtn').addEventListener('click', closeModal);
overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeModal(); });
document.getElementById('toggleFPass').addEventListener('click', ()=>{ fPass.type = fPass.type === 'password' ? 'text' : 'password'; });
document.getElementById('genBtn').addEventListener('click', ()=>{ fPass.value = generatePassword(16); fPass.type = 'text'; });

function generatePassword(len){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%^&*-_=+';
  const arr = crypto.getRandomValues(new Uint32Array(len));
  return Array.from(arr, n => chars[n % chars.length]).join('');
}

document.getElementById('saveBtn').addEventListener('click', async ()=>{
  const site = fSite.value.trim();
  const user = fUser.value.trim();
  const pass = fPass.value;
  const qa = collectQaPairs();
  if(!site){ fSite.focus(); return; }

  const saveBtn = document.getElementById('saveBtn');
  saveBtn.disabled = true;
  saveBtn.textContent = 'Saving…';
  try{
    if(editingId){
      await apiCall('update', { id: editingId, data: JSON.stringify({ id: editingId, site, user, pass, qa }) });
    } else {
      await apiCall('add', { data: JSON.stringify({ site, user, pass, qa }) });
    }
    closeModal();
    await loadEntries();
    showToast(editingId ? 'Entry updated' : 'Entry saved');
  } catch(err){
    showToast('Save failed: ' + err.message);
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = 'Save entry';
  }
});
</script>
